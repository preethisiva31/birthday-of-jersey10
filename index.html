<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Birthday Memory ✨</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <h1 id="type"></h1>
  <p>A small cinematic birthday experience 🎂</p>
  <button onclick="startExperience()">Enter ✨</button>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <h1 class="title">Happy Birthday Surya 🎂</h1>
  <p class="subtitle">A journey from 6th standard ✨</p>

  <!-- STORY MODE -->
  <div class="story-title">🔓 Unlock Memories</div>

  <div class="story-grid">

    <div class="card" onclick="openMemory(1)">📖 6th Standard</div>
    <div class="card" onclick="openMemory(2)">🏫 School Days</div>
    <div class="card" onclick="openMemory(3)">🏏 Silent Journey</div>
    <div class="card" onclick="openMemory(4)">💬 First Talk</div>
    <div class="card final" onclick="openMemory(5)">✨ Final Wish</div>

  </div>

  <!-- MEMORY BOX -->
  <div id="memoryBox" class="memory-box"></div>

  <!-- PHOTO -->
  <div class="photo-card">
    <img src="assets/surya.jpg">
    <p>Jersey No. 10 🏏</p>
  </div>

</div>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <h1>✨ Thank You ✨</h1>
  <p>This memory ends here…</p>
  <h2>Happy Birthday Surya 🎂</h2>
  <p class="sign">— A silent admirer</p>
</div>

<audio id="bgmusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
